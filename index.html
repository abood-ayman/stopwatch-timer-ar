<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ساعة إيقاف ومؤقت تنازلي | أداة مجانية</title>
<meta name="description" content="ساعة إيقاف دقيقة بالمللي ثانية مع تسجيل اللفات، ومؤقت تنازلي بتنبيه صوتي. تعمل على جهازك دون تطبيقات أو حسابات.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:1.6rem 1rem;text-align:center}
header h1{font-size:1.5rem}
.tagline{opacity:.92;font-size:.95rem;margin-top:.25rem}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:1rem}
.card h2{font-size:1.1rem;margin-bottom:.4rem;color:#0f766e}
label{display:block;font-weight:700;margin:.75rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
.row{display:flex;gap:.6rem}
.row>*{flex:1;min-width:0}
button{display:inline-block;width:100%;padding:.8rem;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:1rem}
button:hover{background:#115e59}
button.ghost{background:#e2e8f0;color:#1e293b}
.result{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:10px;padding:1rem;margin-top:1rem;font-size:1.05rem;word-break:break-word}
.result b{color:#047857}
.result.warn{background:#fffbeb;border-color:#fcd34d}
.result.warn b{color:#b45309}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.bad b{color:#b91c1c}
.muted{color:#64748b;font-size:.85rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.2rem 1rem;font-size:.85rem;line-height:1.9}
footer a{color:#5eead4}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right;font-size:.95rem}
.big{font-size:1.6rem;font-weight:800}
.hidden{display:none}
.chk{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.chk input{width:auto}

</style>
</head>
<body>
<header>
<h1>ساعة إيقاف ومؤقت</h1>
<p class="tagline">ساعة إيقاف باللفات + مؤقت تنازلي بتنبيه صوتي</p>
</header>
<main>
<div class="card" style="text-align:center">
<h2>ساعة إيقاف</h2>
<p class="big" id="sw" style="font-size:2.6rem" dir="ltr">00:00.0</p>
<div class="row">
<button id="swBtn" onclick="swToggle()">ابدأ</button>
<button class="ghost" onclick="swLap()">لفة</button>
<button class="ghost" onclick="swReset()">إعادة</button>
</div>
<ul id="laps" dir="ltr" style="text-align:left;margin-top:.6rem"></ul>
</div>
<div class="card" style="text-align:center">
<h2>مؤقت تنازلي</h2>
<p class="big" id="cd" style="font-size:2.6rem" dir="ltr">05:00</p>
<div class="row">
<div><label for="cdMin">دقائق</label><input type="number" inputmode="numeric" id="cdMin" min="0" value="5" onchange="cdReset()"></div>
<div><label for="cdSec">ثوانٍ</label><input type="number" inputmode="numeric" id="cdSec" min="0" max="59" value="0" onchange="cdReset()"></div>
</div>
<div class="row">
<button id="cdBtn" onclick="cdToggle()">ابدأ</button>
<button class="ghost" onclick="cdReset()">إعادة</button>
</div>
</div>

</main>
<footer>
<p>تعمل هذه الأداة بالكامل على جهازك، ولا تُحفظ أو تُرسل أي بيانات إلى أي خادم.</p>
<p>أداة مجانية مفتوحة المصدر · بُنيت بمساعدة أدوات ذكاء اصطناعي · <a href="https://github.com/abood-ayman/stopwatch-timer-ar">الكود على GitHub</a></p>
</footer>
<script>
window.__jserrors=[];window.addEventListener('error',function(e){window.__jserrors.push(String(e.message))});
const g = id => document.getElementById(id);

function fmtSw(ms) {
  const t = Math.floor(ms / 100), s = Math.floor(t / 10), d = t % 10;
  const m = Math.floor(s / 60), ss = s % 60;
  return String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0') + '.' + d;
}
function fmtCd(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// Stopwatch
let swElapsed = 0, swStart = 0, swTimer = null;
function swToggle() {
  if (swTimer) { swElapsed += Date.now() - swStart; clearInterval(swTimer); swTimer = null; g('swBtn').textContent = 'استئناف'; }
  else { swStart = Date.now(); swTimer = setInterval(() => { g('sw').textContent = fmtSw(swElapsed + Date.now() - swStart); }, 100); g('swBtn').textContent = 'إيقاف'; }
}
function swLap() {
  const t = swTimer ? swElapsed + Date.now() - swStart : swElapsed;
  if (t === 0) return;
  const li = document.createElement('li');
  li.textContent = 'لفة ' + (g('laps').children.length + 1) + ': ' + fmtSw(t);
  g('laps').prepend(li);
}
function swReset() {
  clearInterval(swTimer); swTimer = null; swElapsed = 0;
  g('sw').textContent = fmtSw(0); g('swBtn').textContent = 'ابدأ'; g('laps').innerHTML = '';
}

// Countdown
let cdRemaining = 300, cdTimer = null, cdEndAt = 0;
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.connect(gn); gn.connect(ctx.destination);
      o.frequency.value = 880; gn.gain.value = 0.15;
      o.start(ctx.currentTime + i * 0.3); o.stop(ctx.currentTime + i * 0.3 + 0.2);
    }
    setTimeout(() => ctx.close(), 1500);
  } catch (e) { }
}
function cdToggle() {
  if (cdTimer) { clearInterval(cdTimer); cdTimer = null; g('cdBtn').textContent = 'استئناف'; return; }
  if (cdRemaining <= 0) return;
  cdEndAt = Date.now() + cdRemaining * 1000;
  cdTimer = setInterval(() => {
    cdRemaining = Math.max(0, Math.round((cdEndAt - Date.now()) / 1000));
    g('cd').textContent = fmtCd(cdRemaining);
    if (cdRemaining <= 0) { clearInterval(cdTimer); cdTimer = null; g('cdBtn').textContent = 'ابدأ'; beep(); }
  }, 250);
  g('cdBtn').textContent = 'إيقاف';
}
function cdReset() {
  clearInterval(cdTimer); cdTimer = null;
  cdRemaining = Math.max(0, (parseInt(g('cdMin').value, 10) || 0) * 60 + Math.min(59, Math.max(0, parseInt(g('cdSec').value, 10) || 0)));
  g('cd').textContent = fmtCd(cdRemaining);
  g('cdBtn').textContent = 'ابدأ';
}

cdReset();

window.__test = function () {
  const ok = fmtSw(0) === '00:00.0' && fmtSw(65400) === '01:05.4' && fmtSw(600000) === '10:00.0' &&
             fmtCd(300) === '05:00' && fmtCd(0) === '00:00' && fmtCd(75) === '01:15';
  return { pass: ok, details: {} };
};

window.__demo = function () {
  g('sw').textContent = fmtSw(75400);
  g('cdMin').value = 4; g('cdSec').value = 30; cdReset();
};

</script>
</body>
</html>
